conky.config = {
    background = false,
    update_interval = 1,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,
    imlib_cache_size = 0,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    border_inner_margin = 10,
    border_outer_margin = 0,
    xinerama_head = 1,
    alignment = 'top_right',
    gap_x = 10,
    gap_y = 60,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    override_utf8_locale = true,
    use_xft = true,
    font = 'DejaVu Sans:size=10',
    xftalpha = 0.8,
    uppercase = false,
}

conky.text = [[
${font DejaVu Sans:bold:size=12}${color lightgrey}System ${hr 2}$color
${color lightgrey}Host: $color${nodename}
${color lightgrey}Kernel: $color${kernel}
${color lightgrey}Uptime: $color${uptime}

${font DejaVu Sans:bold:size=12}${color lightgrey}CPU ${hr 2}$color
${color lightgrey}CPU Usage: $color${cpu cpu0}% ${cpubar cpu0}
${color lightgrey}Processes: $color${processes}
${color lightgrey}Running: $color${running_processes}

${font DejaVu Sans:bold:size=12}${color lightgrey}Memory ${hr 2}$color
${color lightgrey}RAM Usage: $color$mem/$memmax - $memperc% ${membar}
${color lightgrey}Swap Usage: $color$swap/$swapmax - $swapperc% ${swapbar}

${font DejaVu Sans:bold:size=12}${color lightgrey}Disk ${hr 2}$color
${color lightgrey}Root: $color${fs_used /}/${fs_size /} - ${fs_free_perc /}% ${fs_bar /}
${color lightgrey}Home: $color${fs_used /home}/${fs_size /home} - ${fs_free_perc /home}% ${fs_bar /home}
${color lightgrey}Read: $color${diskio_read}B/s ${color lightgrey}Write: $color${diskio_write}B/s

${font DejaVu Sans:bold:size=12}${color lightgrey}Network ${hr 2}$color
${color lightgrey}IP: $color${addr eth0}
${color lightgrey}Up: $color${upspeed eth0} ${color lightgrey}Down: $color${downspeed eth0}
]]

