# Light theme — high contrast: white background, black text
background            #ffffff
foreground            #000000
selection_background  #000000
selection_foreground  #ffffff
cursor                #000000
cursor_text_color     #ffffff
url_color             #8B0000

# Opacity hurts legibility on light backgrounds
background_opacity    1.0

# Standard ANSI — darker variants for readability on white
color0  #000000
color1  #a00000
color2  #005f00
color3  #6b5400
color4  #000080
color5  #5f005f
color6  #005f5f
color7  #4e4e4e

# Bright — still dark-ish so they remain legible on white
color8  #262626
color9  #c00000
color10 #007f00
color11 #8a6d00
color12 #0000b0
color13 #7a007a
color14 #007a7a
color15 #1c1c1c
